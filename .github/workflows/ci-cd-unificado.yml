name: CI/CD - Infra, Function e WebApp (Unificado)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acao a executar'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm:
        description: 'Para apply, digite "apply"; para destroy, digite "destroy"'
        required: false
      destroy_target:
        description: 'Somente para action=destroy: escopo do destroy'
        required: false
        default: 'aci-only'
        type: choice
        options:
          - all
          - aci-only

env:
  TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}

permissions:
  id-token: write
  contents: read

jobs:
  # ---------- PLAN ----------

  terraform-plan-infra:
    if: github.event.inputs.action == 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -target=azurerm_resource_group.rg \
            -target=azurerm_mysql_flexible_server.mysql \
            -target=azurerm_mysql_flexible_database.db \
            -target=azurerm_mysql_flexible_server_firewall_rule.allow_azure \
            -target=azurerm_storage_account.func_storage \
            -target=azurerm_service_plan.func_plan \
            -target=azurerm_linux_function_app.func

  build-validate-webapp:
    if: github.event.inputs.action == 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem (validacao)
        working-directory: webapp
        run: docker build -t webapp-queimadas:ci .

  # ---------- APPLY ----------

  terraform-apply-infra-and-deploy-function:
    if: github.event.inputs.action == 'apply' && github.event.inputs.confirm == 'apply'
    runs-on: ubuntu-latest
    environment: producao-apply
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Apply
        run: |
          terraform init
          terraform apply -auto-approve \
            -target=azurerm_resource_group.rg \
            -target=azurerm_mysql_flexible_server.mysql \
            -target=azurerm_mysql_flexible_database.db \
            -target=azurerm_mysql_flexible_server_firewall_rule.allow_azure \
            -target=azurerm_storage_account.func_storage \
            -target=azurerm_service_plan.func_plan \
            -target=azurerm_linux_function_app.func

      - name: Wait for Function App to be available
        run: |
          echo "Aguardando a Function App ficar disponível..."
          for i in $(seq 1 10); do
            if az functionapp show --name func-queimadas-pf0807 --resource-group rg-monitor-queimadas > /dev/null 2>&1; then
              echo "Function App encontrada e disponível na tentativa $i."
              exit 0
            fi
            echo "Tentativa $i/10: recurso ainda não visível, aguardando 15s..."
            sleep 15
          done
          echo "Function App não ficou disponível a tempo."
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies into package folder
        working-directory: function
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target ".python_packages/lib/site-packages"

      - name: Deploy Function Code
        uses: Azure/functions-action@v1
        with:
          app-name: func-queimadas-pf0807
          package: function

  build-push-and-deploy-webapp:
    if: github.event.inputs.action == 'apply' && github.event.inputs.confirm == 'apply'
    needs: terraform-apply-infra-and-deploy-function
    runs-on: ubuntu-latest
    environment: producao-apply
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Apply (garante que o ACR existe)
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve -target=azurerm_container_registry.acr

      - name: ACR Login
        run: az acr login --name acrqueimadaspf0807

      - name: Build e Push da imagem
        working-directory: webapp
        run: |
          docker build -t acrqueimadaspf0807.azurecr.io/webapp-queimadas:${{ github.sha }} .
          docker build -t acrqueimadaspf0807.azurecr.io/webapp-queimadas:latest .
          docker push acrqueimadaspf0807.azurecr.io/webapp-queimadas:${{ github.sha }}
          docker push acrqueimadaspf0807.azurecr.io/webapp-queimadas:latest

      - name: Terraform Apply (cria/atualiza o ACI)
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Verificar aplicacao publicada
        run: |
          FQDN=$(az container show \
            --name aci-webapp-queimadas \
            --resource-group rg-monitor-queimadas \
            --query ipAddress.fqdn -o tsv)
          echo "Aguardando aplicacao responder em http://$FQDN:8080 ..."
          for i in $(seq 1 10); do
            if curl -sf "http://$FQDN:8080/health"; then
              echo "Aplicacao respondendo com sucesso."
              break
            fi
            sleep 10
          done

  # ---------- DESTROY ----------

  terraform-destroy:
    if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: producao-destroy
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: terraform init

      - name: Destroy apenas o ACI
        if: github.event.inputs.destroy_target == 'aci-only'
        run: terraform destroy -auto-approve -target=azurerm_container_group.webapp

      - name: Destroy de toda a infraestrutura
        if: github.event.inputs.destroy_target == 'all'
        run: terraform destroy -auto-approve
