name: CI/CD - Infra e Function (Dia 1)

on:
  pull_request:
    branches: [main]
    paths: ['infra/**', 'function/**']
  push:
    branches: [main]
    paths: ['infra/**', 'function/**']

env:
  TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

  terraform-apply-and-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Wait for Function App to be available
        run: |
          echo "Aguardando a Function App ficar disponível..."
          for i in $(seq 1 10); do
            if az functionapp show --name func-queimadas-pf0807 --resource-group rg-monitor-queimadas > /dev/null 2>&1; then
              echo "Function App encontrada e disponível na tentativa $i."
              exit 0
            fi
            echo "Tentativa $i/10: recurso ainda não visível, aguardando 15s..."
            sleep 15
          done
          echo "Function App não ficou disponível a tempo."
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies into package folder
        working-directory: function
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target ".python_packages/lib/site-packages"

      - name: Deploy Function Code
        uses: Azure/functions-action@v1
        with:
          app-name: func-queimadas-pf0807
          package: function
