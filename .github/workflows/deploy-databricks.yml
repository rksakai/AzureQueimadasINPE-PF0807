# .github/workflows/deploy-databricks.yml
name: Deploy Databricks Workspace

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acao a executar: plan (somente visualizar) ou apply (criar/atualizar workspace e cluster)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      confirm:
        description: 'Para action=apply, digite "apply" para confirmar a aplicacao dos recursos'
        required: false

env:
  TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}

permissions:
  id-token: write
  contents: read

jobs:
  # ---------- PLAN ----------

  terraform-plan:
    if: github.event.inputs.action == 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

  # ---------- APPLY ----------

  terraform-apply:
    if: github.event.inputs.action == 'apply' && github.event.inputs.confirm == 'apply'
    runs-on: ubuntu-latest
    environment: producao-apply
    defaults:
      run:
        working-directory: infra
    outputs:
      workspace_url: ${{ steps.tf_output.outputs.workspace_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Capture outputs
        id: tf_output
        run: |
          echo "workspace_url=$(terraform output -raw databricks_workspace_url)" >> "$GITHUB_OUTPUT"

  wait-workspace-ready:
    if: github.event.inputs.action == 'apply' && github.event.inputs.confirm == 'apply'
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: producao-apply
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Poll workspace provisioning state
        run: |
          for i in $(seq 1 30); do
            STATE=$(az resource show \
              --ids "$(az databricks workspace list --query "[?name=='${{ vars.DATABRICKS_WORKSPACE_NAME }}'].id" -o tsv)" \
              --query "properties.provisioningState" -o tsv)
            echo "Tentativa $i: provisioningState=$STATE"
            if [ "$STATE" == "Succeeded" ]; then
              echo "Workspace pronto."
              exit 0
            fi
            sleep 20
          done
          echo "Timeout esperando o workspace ficar pronto."
          exit 1

  configure-cluster:
    if: github.event.inputs.action == 'apply' && github.event.inputs.confirm == 'apply'
    needs: wait-workspace-ready
    runs-on: ubuntu-latest
    environment: producao-apply
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Apply cluster + library (provider databricks)
        run: terraform apply -auto-approve -target=databricks_cluster.etl -target=databricks_library.mysql_jdbc
